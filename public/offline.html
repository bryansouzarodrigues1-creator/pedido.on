<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#c73726"><title>Vamos reconectar · pizzaria.on</title>
<style>body{margin:0;background:#faf8f2;color:#30251e;font:17px/1.6 system-ui}main{max-width:440px;margin:12vh auto;padding:28px}h1{font-size:30px;line-height:1.2}button{border:0;border-radius:12px;padding:14px 20px;background:#c73726;color:white;font:700 16px system-ui;cursor:pointer;min-height:48px}small{display:block;color:#6e6259;margin-top:22px}button:disabled{opacity:.65}#status{min-height:52px}</style>
<main><span aria-hidden="true" style="font-size:42px">🍕</span><h1>Vamos reconectar.</h1><p>A conexão com a pizzaria.on foi interrompida. Voltaremos a esta mesma página quando o serviço responder.</p><p id="status" role="status">Se já enviou um pedido ou uma alteração, confira o resultado antes de tentar enviar de novo.</p><button id="retry" type="button">Tentar novamente</button><small>Esta tela não envia pedidos, mensagens ou pagamentos.</small></main>
<script>
(()=>{let busy=false,timer;const status=document.getElementById('status'),button=document.getElementById('retry');
const target=()=>['/offline','/offline.html'].includes(location.pathname)?'/app':location.href;
function reload(){location.replace(target());}
async function check(){clearTimeout(timer);if(busy||document.visibilityState==='hidden'||!navigator.onLine)return;busy=true;
try{const r=await fetch('/api/connection',{cache:'no-store',redirect:'error',signal:AbortSignal.timeout(5000)});const data=r.ok?await r.json():null;if(data?.ok===true){const key='pizzaria-reconnect-'+location.pathname;let allowed=false;try{const last=Number(sessionStorage.getItem(key)||0);if(Date.now()-last>60000){sessionStorage.setItem(key,String(Date.now()));allowed=true;}}catch{}if(allowed){reload();return;}status.textContent='A conexão voltou. Toque em Tentar novamente para abrir sua página.';}else status.textContent='O serviço ainda não respondeu. Vamos tentar reconectar.';}catch{status.textContent='Ainda sem conexão com a pizzaria.on. Você pode tentar novamente.';}finally{busy=false;if(document.visibilityState!=='hidden')timer=setTimeout(check,10000);}}
button.addEventListener('click',reload);addEventListener('online',check);addEventListener('pageshow',check);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')clearTimeout(timer);else check();});timer=setTimeout(check,2500);
})();
</script></html>
