# Netlify is the public gateway; the existing application keeps D1/R2 bindings.
# Runtime variables must be configured in Netlify UI, never in this file.
[build]
  base = "deploy/netlify"
  ignore = "node ./../../scripts/ignore-netlify-build.mjs"
  command = "node ../../scripts/prepare-netlify.mjs"
  publish = "public"
  edge_functions = "generated/edge-functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "generated/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  publish = "public"

[context.deploy-preview]
  command = "node ../../scripts/prepare-netlify.mjs"
