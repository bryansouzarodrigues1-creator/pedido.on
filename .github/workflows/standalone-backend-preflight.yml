name: Standalone backend migration preflight (no deploy)
on:
  pull_request:
    paths:
      - "vite.config.ts"
      - "build/self-hosted-worker.ts"
      - "lib/self-host-policy.ts"
      - "scripts/check-self-hosted.test.mjs"
      - ".github/workflows/standalone-backend-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-hosted-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      PEDIDO_SELF_HOSTED: "true"
      PEDIDO_D1_DATABASE_ID: "00000000-0000-4000-8000-000000000000"
      PEDIDO_R2_BUCKET_NAME: "pizzaria-on-preflight-dummy"
      PEDIDO_STUDIO_ENABLED: "false"
      PEDIDO_BILLING_ENABLED: "false"
      PEDIDO_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate account-agnostic security and business rules
        run: pnpm test
      - name: Type check complete application
        run: pnpm typecheck
      - name: Build full Vinext application for standalone Cloudflare Worker
        run: pnpm build
      - name: Verify independent Worker exists in bundled output
        run: |
          test -f dist/server/wrangler.json
          node -e "const fs=require('node:fs');const j=JSON.parse(fs.readFileSync('dist/server/wrangler.json','utf8'));const d=j.d1_databases||[]; if(!d.some(x=>x.binding==='DB')) process.exit(1); const r=j.r2_buckets||[]; if(!r.some(x=>x.binding==='BUCKET')) process.exit(2); console.log('Standalone bindings declared (synthetic only).');"
      - name: Explicit limitations
        if: always()
        run: |
          echo "Dry-run only. No Cloudflare account credentials, no D1 transfer, no R2 transfer, no Lovable credits, no deployment, no payment." >> "$GITHUB_STEP_SUMMARY"
          echo "Never deploy with placeholder database ID." >> "$GITHUB_STEP_SUMMARY"
