name: Group beta auth and order checks
on:
  pull_request:
    paths:
      - "lib/invite-policy.ts"
      - "lib/account-access*.ts"
      - "lib/assistant-help.ts"
      - "lib/creation-request.ts"
      - "app/api/restaurants/**/studio/**"
      - "app/api/restaurants/**/ai/images/**"
      - "lib/menu-photo-crops.ts"
      - "lib/menu-reader-policy.ts"
      - "lib/menu-reader-storage.ts"
      - "lib/domain.ts"
      - "lib/promotions.ts"
      - "lib/menu-sales.ts"
      - "components/daily-promotions.tsx"
      - "scripts/check-promotions.test.mjs"
      - "scripts/check-bundle-promotions.test.mjs"
      - "lib/menu-source-links.ts"
      - "components/menu-source-link.tsx"
      - "scripts/check-menu-source-links.test.mjs"
      - "scripts/check-menu-reader.test.mjs"
      - "scripts/check-menu-storage.test.mjs"
      - "scripts/check-menu-import-routes.test.mjs"
      - "scripts/check-order-view.test.mjs"
      - "scripts/check-order-ticket*.test.mjs"
      - "lib/order-ticket.ts"
      - "public/order-print.js"
      - "app/demo/pedidos/**"
      - "components/order-demo.tsx"
      - "lib/order-demo.ts"
      - "public/order-demo-print.js"
      - "scripts/check-order-demo.test.mjs"
      - "components/operation-guide.tsx"
      - "app/pedido/**"
      - "scripts/check-menu-photo-ocr.mjs"
      - "components/ai-import.tsx"
      - "components/product-photo-crop.tsx"
      - "scripts/check-assistant-help.test.mjs"
      - "scripts/check-product-photo-crops.test.mjs"
      - "app/api/admin/access/**"
      - "components/admin-access-control.tsx"
      - "components/admin-report.tsx"
      - "components/dashboard.tsx"
      - "components/account-settings.tsx"
      - "lib/billing.ts"
      - "lib/billing-client.ts"
      - "app/assinatura/**"
      - "components/plan-cards.tsx"
      - "scripts/check-subscription-page.test.mjs"
      - "scripts/check-auth-routes.test.mjs"
      - "scripts/test-backend-fixture.mjs"
      - "lib/asaas*.ts"
      - "app/api/billing/**"
      - "components/billing-controls.tsx"
      - "scripts/check-asaas*.test.mjs"
      - "app/api/account/route.ts"
      - "db/schema.ts"
      - "drizzle/**"
      - "scripts/check-admin-access.test.mjs"
      - "scripts/check-admin-access-worker.test.mjs"
      - "lib/trial-policy.ts"
      - "lib/device-orders.ts"
      - "lib/platform.ts"
      - "lib/image-policy.ts"
      - "app/api/auth/**"
      - "app/api/platform/ai-connection/**"
      - "components/auth-form.tsx"
      - "components/order-tracking.tsx"
      - "components/menu.tsx"
      - "components/studio-chat.tsx"
      - "scripts/check-invite-trial.test.mjs"
      - "scripts/check-device-orders.test.mjs"
      - ".github/workflows/group-beta.yml"
  push:
    branches:
      - "feature/group-onboarding-and-order-recovery"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Pure policies (no network or paid generation)
        run: node --experimental-strip-types --test scripts/check-invite-trial.test.mjs scripts/check-device-orders.test.mjs
      - name: Install dependencies
        run: |
          npm install -g pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Schema metadata
        run: node scripts/check-db-snapshot.mjs
      - name: Domain tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Local OCR and screenshot photo checks (no paid generation)
        run: |
          node --experimental-strip-types scripts/check-menu-ocr.mjs
          node --experimental-strip-types scripts/check-menu-photo-ocr.mjs
      - name: Netlify preparation (no deploy)
        run: pnpm build:netlify
      - name: Gateway static checks
        run: pnpm check:netlify
