name: Public iFood Chrome diagnosis (no login or writes)

on:
  pull_request:
    paths:
      - "scripts/probe-public-store-chrome.mjs"
      - ".github/workflows/public-ifood-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-store:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare Chrome probe tools outside application dependencies
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/ifood-probe-tools" --no-audit --no-fund --save-exact playwright-core@1.64.1
          echo "QA_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "QA_PLAYWRIGHT_MODULE=$RUNNER_TEMP/ifood-probe-tools/node_modules/playwright-core" >> "$GITHUB_ENV"
      - name: Inspect supplied public stores without authentication or writes
        run: node --experimental-strip-types scripts/probe-public-store-chrome.mjs
      - name: Preserve real status, observed products and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: public-ifood-chrome-${{ github.run_id }}
          path: .sites-runtime/public-ifood-chrome/
          if-no-files-found: error
          retention-days: 14
