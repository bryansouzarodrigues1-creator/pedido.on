name: Windows QA - Pizzaria.on (no production)
on:
  pull_request:
    paths:
      - ".github/workflows/windows-qa.yml"
      - "scripts/**"
      - "lib/**"
      - "components/**"
      - "app/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "tools/ifood-capture-runner/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CI: "true"
      PEDIDO_BILLING_ENABLED: "false"
      PEDIDO_TRIAL_ENFORCED: "false"
      PEDIDO_STUDIO_ENABLED: "false"
      PEDIDO_AI_ENABLED: "false"
      PEDIDO_IMAGE_ENABLED: "false"
      PEDIDO_EMAIL_DELIVERY_READY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install exact lockfile locally
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm typecheck
      - name: Verify installed Windows browser and offline capture review
        shell: pwsh
        run: |
          $captureTools = Join-Path $env:RUNNER_TEMP 'ifood-capture-tools'
          npm install --prefix $captureTools --no-audit --no-fund --ignore-scripts --save-exact playwright-core@1.64.1
          if ($LASTEXITCODE -ne 0) { throw 'Could not install isolated browser driver.' }
          $env:QA_PLAYWRIGHT_MODULE = Join-Path $captureTools 'node_modules/playwright-core'
          $env:QA_CHROME_PATH = node --input-type=module -e "import {findWindowsBrowser} from './tools/ifood-capture-runner/desktop.mjs'; process.stdout.write(await findWindowsBrowser() || '');"
          if (!$env:QA_CHROME_PATH) { throw 'No installed Chrome, Edge or Brave found.' }
          node scripts/check-ifood-capture-runner.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic Windows capture verification failed.' }
          node scripts/check-ifood-capture-browser-network.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Chromium network protection verification failed.' }
      - name: Full domain and integration regression
        run: pnpm test
      - name: Prepare project build (no deployment)
        run: pnpm build
      - name: Report limitations
        if: always()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "This isolated Windows runner does not connect to a physical Android, production database, Asaas, iFood credentials, or the Rodrigues notebook. It validates reproducible code tests only."
