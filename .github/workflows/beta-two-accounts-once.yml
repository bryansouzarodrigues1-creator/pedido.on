name: Two beta accounts - manual authorized integration
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Type create-two-test-accounts to authorize two new fictitious beta accounts'
        required: true
        type: string
      expected_release:
        description: 'Full reviewed SHA already deployed on the isolated beta'
        required: true
        type: string
permissions:
  contents: read
jobs:
  integration:
    if: inputs.authorization == 'create-two-test-accounts'
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_release }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - name: Await reviewed release and exercise two real beta accounts
        env:
          CI: 'true'
          QA_BETA_WRITE_ACK: two-test-accounts-20261018
          QA_EXPECTED_RELEASE: ${{ inputs.expected_release }}
        run: node --experimental-strip-types scripts/qa-beta-two-accounts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-two-accounts-${{ github.run_id }}
          path: .sites-runtime/qa-beta-two-accounts/report.json
          if-no-files-found: warn
          retention-days: 14
