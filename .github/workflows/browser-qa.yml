name: Chrome browser QA (isolated local data)

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "scripts/*browser*.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "build/**"
      - "db/**"
      - "drizzle/**"
      - "scripts/run-framework.mjs"
      - "scripts/prepare-*.mjs"
      - "scripts/execution-profile.mjs"
      - ".openai/hosting.json"
      - ".github/workflows/browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install application dependencies
        run: |
          npm install -g pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Prepare browser test tools (outside application dependencies)
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/pizzaria-browser-tools" --no-audit --no-fund --save-exact playwright-core@1.64.1
          node "$RUNNER_TEMP/pizzaria-browser-tools/node_modules/playwright-core/cli.js" install ffmpeg
          command -v google-chrome
          google-chrome --version
          echo "QA_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "QA_PLAYWRIGHT_MODULE=$RUNNER_TEMP/pizzaria-browser-tools/node_modules/playwright-core" >> "$GITHUB_ENV"
      - name: Prepare local PWA and OCR assets (no paid service)
        run: |
          node scripts/prepare-pwa.mjs
          node scripts/prepare-ocr.mjs
          node scripts/prepare-pdf.mjs
      - name: Guest creation and calculator in real Chrome
        env:
          QA_HEADLESS: "true"
        run: node scripts/run-browser-qa-ci.mjs
      - name: Published guest UI and calculator (remote mutations blocked)
        if: ${{ !cancelled() }}
        run: node scripts/check-public-browser.mjs
      - name: Probe the supplied public iFood URL without credentials or writes
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types scripts/probe-public-store.mjs
      - name: Preserve screenshots and reports, including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: chrome-qa-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            .sites-runtime/browser-ci/*.json
            .sites-runtime/browser-ci/*.log
            .sites-runtime/browser-ci/guest/evidence/
            .sites-runtime/browser-ci/calculator/
            .sites-runtime/browser-ci/handoff/
            .sites-runtime/browser-ci/owner/
            .sites-runtime/browser-ci/intake-options/
            .sites-runtime/browser-ci/documents/
            .sites-runtime/browser-ci/ocr/
            .sites-runtime/browser-ci/styles/
            .sites-runtime/browser-ci/public/summary.json
            .sites-runtime/browser-ci/public/guest/evidence/
            .sites-runtime/browser-ci/public/calculator/
            .sites-runtime/browser-ci/public/ocr/
            .sites-runtime/browser-ci/public/styles/
            .sites-runtime/browser-ci/public/documents/
