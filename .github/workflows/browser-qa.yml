name: Chrome browser QA (isolated local data)

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "scripts/*browser*.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "build/**"
      - "db/**"
      - "drizzle/**"
      - "scripts/run-framework.mjs"
      - "scripts/prepare-*.mjs"
      - "scripts/execution-profile.mjs"
      - ".openai/hosting.json"
      - ".github/workflows/browser-qa.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: "Cenário no banco descartável"
        type: choice
        default: all
        options: [all, welcome-kit, owner-control]

permissions:
  contents: read

concurrency:
  group: chrome-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.suite == 'welcome-kit' && '["welcome-kit"]' || github.event_name == 'workflow_dispatch' && inputs.suite == 'owner-control' && '["owner-control"]' || '["core","welcome-kit","owner-control"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install application dependencies
        run: |
          npm install -g pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Prepare browser test tools (outside application dependencies)
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/pizzaria-browser-tools" --no-audit --no-fund --save-exact playwright-core@1.64.1
          node "$RUNNER_TEMP/pizzaria-browser-tools/node_modules/playwright-core/cli.js" install ffmpeg
          command -v google-chrome
          google-chrome --version
          echo "QA_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "QA_PLAYWRIGHT_MODULE=$RUNNER_TEMP/pizzaria-browser-tools/node_modules/playwright-core" >> "$GITHUB_ENV"
      - name: Prepare local PWA and OCR assets (no paid service)
        run: |
          node scripts/prepare-pwa.mjs
          node scripts/prepare-ocr.mjs
          node scripts/prepare-pdf.mjs
      - name: Guest creation and calculator in real Chrome
        env:
          QA_HEADLESS: "true"
          QA_BROWSER_SUITE: ${{ matrix.suite }}
        run: node scripts/run-browser-qa-ci.mjs
      - name: Published guest UI and calculator (remote mutations blocked)
        if: ${{ success() && matrix.suite == 'core' }}
        run: node scripts/check-public-browser.mjs
      - name: Preserve screenshots and reports, including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: chrome-qa-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          retention-days: 14
          if-no-files-found: error
          path: |
            .sites-runtime/browser-ci/*.json
            .sites-runtime/browser-ci/*.log
            .sites-runtime/browser-ci/creator/
            .sites-runtime/browser-ci/creator-recovery/
            .sites-runtime/browser-ci/customer-journey/
            .sites-runtime/browser-ci/guest/evidence/
            .sites-runtime/browser-ci/calculator/
            .sites-runtime/browser-ci/registration-card/
            .sites-runtime/browser-ci/auth-mobile/
            .sites-runtime/browser-ci/owner-hours/
            .sites-runtime/browser-ci/business-info/
            .sites-runtime/browser-ci/account-navigation/
            .sites-runtime/browser-ci/welcome-kit/
            .sites-runtime/browser-ci/first-steps/
            .sites-runtime/browser-ci/customer-assistant/
            .sites-runtime/browser-ci/owner-control/
            .sites-runtime/browser-ci/handoff/
            .sites-runtime/browser-ci/owner/
            .sites-runtime/browser-ci/store-safety/
            .sites-runtime/browser-ci/assistance/
            .sites-runtime/browser-ci/daily-campaigns/
            .sites-runtime/browser-ci/professional/
            .sites-runtime/browser-ci/pwa-recovery/
            .sites-runtime/browser-ci/auth-journey/
            .sites-runtime/browser-ci/intake-options/
            .sites-runtime/browser-ci/documents/
            .sites-runtime/browser-ci/shared-ifood/
            .sites-runtime/browser-ci/ifood-connect/
            .sites-runtime/browser-ci/apify-menu/
            .sites-runtime/browser-ci/ocr/
            .sites-runtime/browser-ci/styles/
            .sites-runtime/browser-ci/public/summary.json
            .sites-runtime/browser-ci/public/guest/evidence/
            .sites-runtime/browser-ci/public/calculator/
            .sites-runtime/browser-ci/public/ocr/
            .sites-runtime/browser-ci/public/styles/
            .sites-runtime/browser-ci/public/documents/
            .sites-runtime/browser-ci/public/shared-ifood/
            .sites-runtime/browser-ci/public/ifood-connect/
